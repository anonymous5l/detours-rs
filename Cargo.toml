[package]
name = "detours-rs"
version = "0.1.3"
edition = "2024"

[dependencies]
capstone = { version = "0.13.0", features = ["std"], default-features = false }
fnv = "1.0.7"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59.0"
features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    # 线程挂起 + CONTEXT（GetThreadContext/SetThreadContext）
    "Win32_System_Kernel",
]
